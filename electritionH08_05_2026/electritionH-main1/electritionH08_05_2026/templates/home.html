<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>⚡ Advanced Electrician Management System</title>

<!-- GOOGLE FONT -->
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<!-- FONT AWESOME -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:#0f172a;
    color:white;
}

/* ================= BACKGROUND ================= */

.bg{

    position:absolute;
    width:100%;
    height:100vh;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #1e293b
    );

}

/* ================= GLOW EFFECTS ================= */

.glow{

    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.5;
    animation:float 10s infinite ease-in-out;

}

.glow1{
    width:300px;
    height:300px;
    background:#06b6d4;
    top:-80px;
    left:-80px;
}

.glow2{
    width:400px;
    height:400px;
    background:#3b82f6;
    bottom:-120px;
    right:-120px;
    animation-delay:2s;
}

.glow3{
    width:250px;
    height:250px;
    background:#0ea5e9;
    top:40%;
    left:40%;
    animation-delay:4s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-40px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* ================= NAVBAR ================= */

nav{

    width:100%;
    padding:20px 60px;

    position:absolute;
    top:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;

}

.logo{

    font-size:28px;
    font-weight:700;
    color:#38bdf8;

}

.nav-links a{

    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:0.3s;

}

.nav-links a:hover{

    color:#38bdf8;

}

/* ================= HERO ================= */

.hero{

    position:relative;
    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:50px;

}

/* ================= GLASS CARD ================= */

.card{

    width:1100px;
    max-width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:60px;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.5);

    animation:fadeUp 1.2s ease;

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= LEFT CONTENT ================= */

.left{

    width:55%;

}

.tag{

    display:inline-block;

    background:#0ea5e9;

    color:white;

    padding:8px 18px;

    border-radius:30px;

    margin-bottom:20px;

    font-size:14px;

}

.left h1{

    font-size:58px;
    line-height:1.2;

    margin-bottom:20px;

}

.left h1 span{

    color:#38bdf8;

}

.left p{

    color:#cbd5e1;

    font-size:18px;

    line-height:1.8;

    margin-bottom:35px;

}

/* ================= BUTTONS ================= */

.buttons{

    display:flex;
    gap:20px;

}

.btn{

    padding:14px 32px;

    border:none;
    border-radius:40px;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:0.4s;

}

/* LOGIN */

.login{

    background:#38bdf8;
    color:#0f172a;

}

.login:hover{

    transform:translateY(-5px);

    box-shadow:
    0 0 20px #38bdf8;

}

/* REGISTER */

.register{

    background:transparent;

    color:white;

    border:2px solid #38bdf8;

}

.register:hover{

    background:#38bdf8;
    color:#0f172a;

    transform:translateY(-5px);

}

/* ================= RIGHT SIDE ================= */

.right{

    width:40%;
    text-align:center;

}

.circle{

    width:320px;
    height:320px;

    margin:auto;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #0ea5e9,
        #2563eb
    );

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 0 50px rgba(56,189,248,0.5);

    animation:pulse 3s infinite;

}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}

.circle i{

    font-size:130px;
    color:white;

}

/* ================= FEATURES ================= */

.features{

    display:flex;
    gap:20px;

    margin-top:40px;

}

.feature{

    background:rgba(255,255,255,0.05);

    padding:18px;

    border-radius:15px;

    flex:1;

    text-align:center;

    transition:0.4s;

}

.feature:hover{

    transform:translateY(-8px);

    background:rgba(56,189,248,0.1);

}

.feature i{

    color:#38bdf8;
    font-size:28px;

    margin-bottom:10px;

}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .card{

        flex-direction:column;
        text-align:center;

    }

    .left,
    .right{

        width:100%;

    }

    .left h1{

        font-size:40px;

    }

    .features{

        flex-direction:column;

    }

    nav{

        padding:20px;

    }

}

</style>

</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>

<!-- GLOW -->
<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<!-- NAVBAR -->

<nav>

    <div class="logo">
        ⚡ ElectricianPro
    </div>

    <div class="nav-links">

        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>

    </div>

</nav>

<!-- HERO -->

<section class="hero">

<div class="card">

    <!-- LEFT -->

    <div class="left">

        <div class="tag">
            ⚡ Enterprise Electrician Platform
        </div>

        <h1>

            Smart
            <span>Electrician</span>

            Management System

        </h1>

        <p>

            Advanced workflow platform for
            electrician task management,
            payment tracking,
            material handling,
            job allocation,
            and real-time monitoring.

        </p>

        <!-- BUTTONS -->

        <div class="buttons">

            <a href="/login">

                <button class="btn login">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

            </a>

            <a href="/register">

                <button class="btn register">

                    <i class="fa-solid fa-user-plus"></i>

                    Register

                </button>

            </a>

        </div>

        <!-- FEATURES -->

        <div class="features">

            <div class="feature">

                <i class="fa-solid fa-list-check"></i>

                <h4>Task Control</h4>

            </div>

            <div class="feature">

                <i class="fa-solid fa-wallet"></i>

                <h4>Payments</h4>

            </div>

            <div class="feature">

                <i class="fa-solid fa-chart-line"></i>

                <h4>Reports</h4>

            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="circle">

            <i class="fa-solid fa-bolt"></i>

        </div>

    </div>

</div>

</section>

</body>
</html>
